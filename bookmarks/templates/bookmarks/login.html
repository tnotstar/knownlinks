{% extends "bookmarks/base.html" %}

{% block content %}
<div class="flex-1 flex flex-col items-center justify-center bg-bgMain">
    <div class="w-full max-w-sm bg-bgSidebar border border-borderColor rounded-xl shadow-xl overflow-hidden p-8">
        <h2 class="text-2xl font-semibold mb-6 text-center">Sign In</h2>
        
        {% if form.errors %}
        <div class="mb-4 text-red-400 text-sm text-center">
            Your username and password didn't match. Please try again.
        </div>
        {% endif %}
        
        <form method="post" action="{% url 'bookmarks:login' %}" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="id_username" class="block text-textMuted text-xs font-medium mb-1">Username</label>
                <input type="text" name="username" id="id_username" required autofocus
                    class="w-full bg-bgInput border border-borderColor rounded-md px-3 py-2 text-sm text-textPrimary focus:outline-none focus:border-gray-500 transition-colors">
            </div>
            <div>
                <label for="id_password" class="block text-textMuted text-xs font-medium mb-1">Password</label>
                <input type="password" name="password" id="id_password" required
                    class="w-full bg-bgInput border border-borderColor rounded-md px-3 py-2 text-sm text-textPrimary focus:outline-none focus:border-gray-500 transition-colors">
            </div>
            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 px-4 rounded-md transition-colors mt-2">
                Sign In
            </button>
            <input type="hidden" name="next" value="{{ next|default:'' }}">
        </form>
    </div>
</div>
{% endblock %}
